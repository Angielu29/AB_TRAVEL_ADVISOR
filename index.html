<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AB Travel Advisor - Viajes de fin de semana y aventuras accesibles">
    <title>AB Travel Advisor | Weekend Adventures</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;400i&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --azul-principal: #1E3A8A;
            --azul-secundario: #60A5FA;
            --dorado: #D4AF37;
        }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: #F8F9FA;
        }
        .heading-font { 
            font-family: 'Montserrat', sans-serif; 
        }

        .hero-bg {
            background-image: linear-gradient(rgba(30, 58, 138, 0.85), rgba(30, 58, 138, 0.85)), 
                             url('https://source.unsplash.com/random/1920x1080/?mountain,lake,adventure');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#1E3A8A] rounded-full flex items-center justify-center text-white font-bold text-xl">AB</div>
                <span id="logo-text" class="text-xl font-bold heading-font text-[#1E3A8A]">AB Travel</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleLanguage()" id="lang-btn"
                        class="px-5 py-2 text-sm font-bold border-2 border-gray-300 rounded-full hover:bg-gray-100 transition-all">
                    <span id="lang-es" class="text-[#1E3A8A]">ES</span> / 
                    <span id="lang-en">EN</span>
                </button>
                
                <button onclick="document.getElementById('contact-section').scrollIntoView({ behavior: 'smooth' })"
                        class="bg-[#60A5FA] hover:bg-[#1E3A8A] text-white px-5 py-2.5 rounded-full text-sm font-semibold">
                    <span id="cotizar-btn">Cotizar Viaje</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-bg flex items-center text-white">
        <div class="max-w-4xl mx-auto px-5 text-center">
            <h1 id="hero-title" class="text-4xl md:text-6xl font-bold heading-font mb-6 leading-tight">
                Aventuras de fin de semana<br>al alcance de tu presupuesto
            </h1>
            <p id="hero-subtitle" class="text-lg md:text-xl mb-10 text-gray-100">
                Viajes personalizados para millennials y parejas desde Virginia.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="document.getElementById('destinos').scrollIntoView({ behavior: 'smooth' })" 
                        class="bg-white text-[#1E3A8A] hover:bg-[#D4AF37] hover:text-white px-8 py-4 rounded-2xl text-base font-semibold">
                    <span id="btn-destinos">Explorar Destinos</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Destinos -->
    <section id="destinos" class="py-16 bg-[#F1F3F5]">
        <div class="max-w-7xl mx-auto px-5">
            <h2 id="destinos-title" class="text-3xl md:text-4xl font-bold heading-font text-center text-[#1E3A8A] mb-12">Destinos Populares</h2>
            
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="bg-white rounded-3xl overflow-hidden shadow-md card-hover">
                    <img src="https://source.unsplash.com/random/600x400/?mountains" class="w-full h-56 object-cover" alt="Shenandoah">
                    <div class="p-6">
                        <div class="flex justify-between items-start">
                            <h3 class="text-2xl font-bold heading-font">Shenandoah</h3>
                            <span class="text-[#D4AF37] font-bold">$189</span>
                        </div>
                        <p class="text-[#6B7280]">2 días • Senderismo</p>
                        <button onclick="alert('¡Te prepararé una cotización!')" class="mt-6 w-full bg-[#60A5FA] hover:bg-[#1E3A8A] text-white py-3 rounded-2xl">Quiero este viaje</button>
                    </div>
                </div>
                <!-- Agrega más tarjetas aquí si quieres -->
            </div>
        </div>
    </section>

    <!-- Contacto y Footer (mantengo simple por ahora) -->
    <section id="contact-section" class="py-16 bg-white">
        <div class="max-w-xl mx-auto px-5 text-center">
            <h2 id="contact-title" class="text-3xl md:text-4xl font-bold heading-font text-[#1E3A8A]">¿Listo para tu próxima aventura?</h2>
            <p id="contact-subtitle" class="text-gray-600 mt-4 mb-8">Envíame tus datos y te armo tu plan personalizado</p>
            <!-- Formulario aquí -->
        </div>
    </section>

    <script>
        let currentLang = 'es';

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            const es = document.getElementById('lang-es');
            const en = document.getElementById('lang-en');

            if (currentLang === 'en') {
                es.style.opacity = '0.4';
                en.style.opacity = '1';
                // Traducciones a inglés aquí
                document.getElementById('hero-title').innerHTML = 'Weekend Adventures<br>Within Your Budget';
                document.getElementById('hero-subtitle').textContent = 'Personalized trips for millennials and couples from Virginia.';
                document.getElementById('btn-destinos').textContent = 'Explore Destinations';
                document.getElementById('cotizar-btn').textContent = 'Get a Quote';
                document.getElementById('destinos-title').textContent = 'Popular Destinations';
                document.getElementById('contact-title').textContent = 'Ready for your next adventure?';
                document.getElementById('contact-subtitle').textContent = "Send me your details and I'll create a personalized plan";
            } else {
                es.style.opacity = '1';
                en.style.opacity = '0.4';
                // Volver a español
                document.getElementById('hero-title').innerHTML = 'Aventuras de fin de semana<br>al alcance de tu presupuesto';
                document.getElementById('hero-subtitle').textContent = 'Viajes personalizados para millennials y parejas desde Virginia.';
                document.getElementById('btn-destinos').textContent = 'Explorar Destinos';
                document.getElementById('cotizar-btn').textContent = 'Cotizar Viaje';
                document.getElementById('destinos-title').textContent = 'Destinos Populares';
                document.getElementById('contact-title').textContent = '¿Listo para tu próxima aventura?';
                document.getElementById('contact-subtitle').textContent = 'Envíame tus datos y te armo tu plan personalizado';
            }
        }
    </script>
</body>
</html>
