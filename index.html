<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AB Travel Advisor - Viajes de fin de semana y aventuras accesibles para millennials y parejas en Virginia y alrededores.">
    <title>AB Travel Advisor | Viajes de Fin de Semana y Aventuras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', sans-serif; }

        .hero-bg {
            background-image: linear-gradient(rgba(30, 58, 138, 0.8), rgba(30, 58, 138, 0.8)), 
                             url('https://source.unsplash.com/random/1920x1080/?travel,mountains,lake');
            background-size: cover;
            background-position: center;
        }

        .card-hover:hover { transform: translateY(-12px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#1E3A8A] rounded-full flex items-center justify-center text-white font-bold text-2xl">AB</div>
                <span class="text-2xl font-bold tracking-tight heading-font text-[#1E3A8A]">AB Travel</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#destinos" class="hover:text-[#1E3A8A]">Destinos</a>
                <a href="#ofertas" class="hover:text-[#1E3A8A]">Ofertas</a>
                <a href="#por-que" class="hover:text-[#1E3A8A]">¿Por qué AB?</a>
                <a href="#contact-section" class="hover:text-[#1E3A8A]">Contacto</a>
            </div>

            <button onclick="document.getElementById('contact-section').scrollIntoView({ behavior: 'smooth' })"
                    class="bg-[#60A5FA] hover:bg-[#1E3A8A] text-white px-6 py-3 rounded-full text-sm font-semibold transition-all">
                Cotizar Viaje
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-bg h-screen flex items-center text-white">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h1 class="text-5xl md:text-6xl font-bold heading-font mb-6 leading-tight">
                Aventuras de fin de semana<br>que caben en tu presupuesto
            </h1>
            <p class="text-xl md:text-2xl mb-10 text-gray-100">
                Viajes personalizados para millennials y parejas desde Virginia.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="document.getElementById('destinos').scrollIntoView({ behavior: 'smooth' })" 
                        class="bg-white text-[#1E3A8A] hover:bg-[#D4AF37] hover:text-white px-10 py-4 rounded-2xl text-lg font-semibold">
                    Explorar Destinos
                </button>
            </div>
        </div>
    </header>

    <!-- Destinos, Ofertas, Por qué, Contacto y Footer se mantienen similares al Paso 4 -->

    <!-- WhatsApp Button -->
    <a href="https://wa.me/15753139351" target="_blank" 
       class="fixed bottom-6 right-6 bg-[#25D366] text-white w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-xl z-50 hover:scale-110 transition">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // Mensaje simple
        console.log("%cAB Travel Advisor - Listo para ayudarte a viajar mejor", "color: #1E3A8A; font-size: 14px");
    </script>
</body>
</html>
